[package]
name = "polis-ili9341"
version = "0.1.0"
edition.workspace = true
publish = ["crates-io"]
rust-version = "1.99"
readme = "README.md"
license = "MIT"
description = "Buffered async ILI9341 driver with RGB565 and PIO-expanded RGB332 framebuffers"

[features]
default = []
rp2040 = ["dep:polis-pio-i8080", "polis-pio-i8080/rp2040", "dep:embassy-rp", "embassy-rp/rp2040"]
rp235xa = ["dep:polis-pio-i8080", "polis-pio-i8080/rp235xa", "dep:embassy-rp", "embassy-rp/rp235xa"]
link-check = ["embassy-example"]

# Opt-in Pico/Pico 2 usage example; normal library builds select no runtime.
example-rp2040 = ["embassy-example", "rp2040"]
example-rp235xa = ["embassy-example", "rp235xa"]
embassy-example = [
    "embassy-rp/rt", "embassy-rp/time-driver", "embassy-rp/critical-section-impl",
    "embassy-rp/executor-thread", "embassy-rp/boot2-w25q080",
    "dep:embassy-rp",
    "dep:embassy-time",
    "dep:embassy-executor",
    "dep:cortex-m-rt",
    "dep:panic-probe",
    "dep:defmt-rtt",
    "dep:defmt",
    "dep:embedded-hal-bus",
    "dep:mousefood",
    "dep:ratatui-core",
    "dep:embedded-alloc",
    "dep:portable-atomic",
]

[[example]]
name = "embassy"
required-features = ["embassy-example"]
test = false
bench = false

[[example]]
name = "parallel"
required-features = ["embassy-example"]
test = false
bench = false

[[example]]
name = "parallel_rgb332"
required-features = ["embassy-example"]
test = false
bench = false

[[example]]
name = "parallel_rgb332_bench"
required-features = ["embassy-example"]
test = false
bench = false

[dependencies]
polis-pio-i8080 = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
lcd-async = { version = "0.1.3", default-features = false }
embedded-hal-bus = { workspace = true, optional = true }
embedded-graphics-core.workspace = true

# UI and allocation belong only to the opt-in example.
mousefood = { version = "0.4.0", default-features = false, optional = true }
ratatui-core = { version = "0.1.2", default-features = false, features = ["portable-atomic"], optional = true }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"], optional = true }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"], optional = true }

[dev-dependencies]
embassy-futures.workspace = true

[package.metadata.polis]
embassy-example = true
chip-features = true
link-examples = ["parallel", "parallel_rgb332", "parallel_rgb332_bench"]

[package.metadata.docs.rs]
default-target = "thumbv6m-none-eabi"
targets = ["thumbv6m-none-eabi"]
features = ["rp2040"]
