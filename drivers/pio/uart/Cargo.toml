[package]
name = "pio-uart"
version = "0.1.0"
edition.workspace = true
publish = ["crates-io"]
rust-version = "1.99"
readme = "README.md"
license = "MIT"
description = "RP2040 and RP2350 PIO UART with physical transmit completion"

[features]
default = []
rp2040 = ["dep:embassy-rp", "embassy-rp/rp2040", "dep:embassy-time"]
rp235xa = ["dep:embassy-rp", "embassy-rp/rp235xa", "dep:embassy-time"]

[dependencies]
embassy-rp = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embedded-io-async.workspace = true

[package.metadata.polis]
chip-features = true

[package.metadata.docs.rs]
default-target = "thumbv6m-none-eabi"
targets = ["thumbv6m-none-eabi"]
features = ["rp2040"]
