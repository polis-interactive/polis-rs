[package]
name = "polis-control-link-tokio"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
description = "Point-to-point TCP and serial control links for Tokio"
readme = "README.md"
license = "MIT"
publish = ["crates-io"]

[features]
default = ["tcp"]
tcp = ["tokio/net"]
serial = ["dep:tokio-serial"]

[dependencies]
polis-control-link-protocol.workspace = true
polis-framing.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-serial = { version = "5.5.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[package.metadata.polis]
platforms = ["native"]
feature-sets = [[], ["tcp"], ["serial"], ["tcp", "serial"]]

[package.metadata.docs.rs]
features = ["tcp", "serial"]
