name: Libraries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: python3 tools/check.py test
      - run: python3 tools/check-led-macro.py
      - run: python3 tools/check.py clippy
      - run: python3 tools/check.py build
      - run: python3 tools/check.py doc
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --workspace
  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [rp2040, rp2350]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - run: python3 tools/check.py build --platform ${{ matrix.platform }}
      - run: python3 tools/check.py clippy --platform ${{ matrix.platform }}
