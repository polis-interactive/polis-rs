[workspace]
resolver = "3"
members = [
    "crates/protocol-framing",
    "crates/led-output",
    "crates/discovery/discovery-protocol",
    "crates/discovery/discovery-tokio",
    "crates/discovery/discovery-embassy",
    "crates/control-link/control-link-protocol",
    "crates/control-link/control-link-tokio",
    "crates/control-link/control-link-embassy",
    "drivers/ads1x1x",
    "drivers/joystick",
    "drivers/tmp1x2",
    "drivers/max31865",
    "drivers/rs485",
    "drivers/w5500",
    "drivers/pio/i2c",
    "drivers/pio/uart",
    "drivers/pio/encoder",
    "drivers/pio/sk6812",
    "drivers/pio/ws2813",
]
default-members = [
    "crates/protocol-framing",
    "crates/led-output",
    "crates/discovery/discovery-protocol",
    "crates/discovery/discovery-tokio",
    "crates/discovery/discovery-embassy",
    "crates/control-link/control-link-protocol",
    "crates/control-link/control-link-tokio",
    "crates/control-link/control-link-embassy",
    "drivers/ads1x1x",
    "drivers/joystick",
    "drivers/tmp1x2",
    "drivers/max31865",
    "drivers/rs485",
    "drivers/w5500",
    "drivers/pio/i2c",
    "drivers/pio/uart",
    "drivers/pio/encoder",
    "drivers/pio/sk6812",
    "drivers/pio/ws2813",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
polis-ads1x1x = { path = "drivers/ads1x1x", version = "0.1.0", default-features = false }
polis-framing = { path = "crates/protocol-framing", version = "0.1.0", default-features = false }
polis-discovery-protocol = { path = "crates/discovery/discovery-protocol", version = "0.1.0", default-features = false }
polis-control-link-protocol = { path = "crates/control-link/control-link-protocol", version = "0.1.0", default-features = false }
polis-pio-uart = { path = "drivers/pio/uart", version = "0.1.0", default-features = false }
polis-led-output = { path = "crates/led-output", version = "0.1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
cobs = { version = "0.3", default-features = false }
crc = { version = "3.3", default-features = false }
bitflags = { version = "2.10", default-features = false }
libm = { version = "0.2", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
tokio = { version = "1.53", default-features = false }
embassy-net = { version = "0.9.1", default-features = false }
embassy-rp = { version = "0.10.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }
embassy-futures = "0.1.2"
embassy-net-wiznet = "0.3.0"
embassy-executor = { version = "0.10.0", default-features = false }
fixed = "1.31.0"
pio = "0.3.0"
smart-leds = "0.4.0"
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
defmt-rtt = "1.0.0"
defmt = "1.0.1"
embassy-net-driver = "0.2.0"
embedded-hal-bus = { version = "0.3.0", default-features = false, features = ["async"] }

# Build tooling maps one platform selection to package features and target.
[workspace.metadata.platforms.rp2040]
target = "thumbv6m-none-eabi"
feature = "rp2040"

[workspace.metadata.platforms.rp2350]
target = "thumbv8m.main-none-eabihf"
feature = "rp235xa"

[profile.release]
debug = 2
lto = true
codegen-units = 1
